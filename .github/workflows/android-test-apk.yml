# يبني ملف APK للتجربة على أي جوال أندرويد (بدون مفتاح توقيع ولا إعدادات) على سيرفرات GitHub مجاناً
# يشتغل تلقائياً كل ما ترفع ملفات جديدة، أو يدوياً من تبويب Actions
name: Android - ملف APK للتجربة
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: تثبيت الحزم
        run: npm install
      - name: الخطوط داخل التطبيق
        run: npm run fonts
      - name: إنشاء مشروع أندرويد
        run: npx cap add android
      - name: الأيقونات وشاشة البداية
        run: npx capacitor-assets generate --android --iconBackgroundColor '#2e0814' --splashBackgroundColor '#2e0814' --splashBackgroundColorDark '#2e0814'
      - name: مزامنة
        run: npx cap sync android
      - name: بناء APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../moor-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: moor-test-apk
          path: moor-test.apk
