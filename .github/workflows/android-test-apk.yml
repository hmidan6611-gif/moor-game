# يبني ملف APK للتجربة على أي جوال أندرويد (بدون مفتاح توقيع ولا إعدادات) على سيرفرات GitHub مجاناً
# يشتغل تلقائياً كل ما ترفع ملفات جديدة، أو يدوياً من تبويب Actions
name: Android - ملف APK للتجربة
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: أدوات أندرويد (موجودة مسبقاً على السيرفر)
        run: echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" && ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
      - name: تثبيت الحزم
        run: npm install
      - name: الخطوط داخل التطبيق
        run: npm run fonts
      - name: إنشاء مشروع أندرويد
        run: npx cap add android
      - name: تثبيت الشاشة على الوضع العمودي
        run: node scripts/lock-portrait.js
      - name: الأيقونات وشاشة البداية
        run: npx capacitor-assets generate --android --iconBackgroundColor '#2e0814' --splashBackgroundColor '#2e0814' --splashBackgroundColorDark '#2e0814'
      - name: مزامنة
        run: npx cap sync android
      - name: بناء APK
        working-directory: android
        run: |
          chmod +x gradlew
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties || true
          V=$(grep -o 'gradle-[0-9.]*-' gradle/wrapper/gradle-wrapper.properties | head -1 | sed 's/gradle-//;s/-$//')
          if ! curl -fsL -r 0-1023 --max-time 25 -o /dev/null "https://services.gradle.org/distributions/gradle-$V-bin.zip"; then
            echo "Gradle mirror for $V"; sed -i "s#^distributionUrl=.*#distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-$V-bin.zip#" gradle/wrapper/gradle-wrapper.properties
            mkdir -p ~/.gradle/init.d
            printf '%s\n' "allprojects {" "  buildscript { repositories { maven { url 'https://maven.aliyun.com/repository/public' }; maven { url 'https://maven.aliyun.com/repository/google' } } }" "  repositories { maven { url 'https://maven.aliyun.com/repository/public' }; maven { url 'https://maven.aliyun.com/repository/google' } }" "}" > ~/.gradle/init.d/mirror.gradle
            cat ~/.gradle/init.d/mirror.gradle
          fi
          cat gradle/wrapper/gradle-wrapper.properties
          for n in 1 2 3 4; do ./gradlew assembleDebug && break; echo "retry $n after network error"; sleep 45; done
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../moor-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: moor-test-apk
          path: moor-test.apk
      - name: رابط تحميل مباشر للجوال
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-apk -y --cleanup-tag || true
          gh release create test-apk moor-test.apk --title "مور - نسخة تجربة (${{ github.run_number }})" --notes "افتح الرابط من الجوال ونزّل moor-test.apk وثبّته." --latest
